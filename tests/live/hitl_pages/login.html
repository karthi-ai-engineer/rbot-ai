<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Test Shop</title>
<link rel="stylesheet" href="shop.css">
</head>
<body>
<div class="test-badge" role="note" aria-label="Test page notice">TEST PAGE · local only · no real accounts</div>
<header class="site"><div class="inner">
  <a class="logo" href="index.html">Test<span>Shop</span></a>
  <nav class="main" aria-label="Main">
    <a href="index.html">Home</a><a href="cookies.html">Blog</a><a href="checkout.html">Cart (1)</a>
  </nav>
</div></header>

<main>
  <div class="card narrow">
    <h1>Sign in</h1>
    <p class="muted">Sign in to your Test Shop account to see your orders.</p>

    <form id="login-form" novalidate aria-label="Sign in">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="username" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required>

      <p class="small" style="margin:8px 0 0"><a href="#" id="forgot">Forgot password?</a></p>

      <div id="error" class="alert alert-error hidden" role="alert"></div>
      <div id="busy" class="alert alert-info hidden" role="status"><span class="spinner"></span>&nbsp; Signing in…</div>

      <button type="submit" id="signin" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="small muted" style="margin-top:18px">New here? <a href="#">Create an account</a></p>
  </div>
</main>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var failMode = q.get("fail") === "1";      // ?fail=1 : password is always "wrong" (tests 'blocker still present')
  var toOtp = q.get("otp") === "1";          // ?otp=1  : continue to the 2-step verification page
  var form = document.getElementById("login-form");
  var email = document.getElementById("email");
  var pw = document.getElementById("password");
  var err = document.getElementById("error");
  var busy = document.getElementById("busy");
  var btn = document.getElementById("signin");

  function showError(msg) { err.textContent = msg; err.classList.remove("hidden"); }

  document.getElementById("forgot").addEventListener("click", function (e) {
    e.preventDefault(); showError("Password reset is not available on this test page.");
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.classList.add("hidden");
    if (!email.value.trim() || !pw.value) { showError("Enter your email address and password."); return; }
    btn.disabled = true; busy.classList.remove("hidden");
    setTimeout(function () {
      busy.classList.add("hidden"); btn.disabled = false;
      if (failMode) {
        pw.value = ""; pw.focus();
        showError("Incorrect email or password. Please try again.");
        return;
      }
      location.href = toOtp ? "otp.html" + (q.get("hint") === "1" ? "?hint=1" : "") : "welcome.html?from=login";
    }, 1000);
  });
})();
</script>
</body>
</html>
